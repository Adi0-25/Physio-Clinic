# ==========================================================
# Dr. Sanjit Kumar Physiotherapy Clinic - Application Config
# All values are read from environment variables so the SAME
# jar/image can run locally and on Render without code changes.
# See README.md for how to set these on Render.
# ==========================================================

spring.application.name=physio-clinic

# ---- Server ----
# Render provides the PORT env variable at runtime
server.port=${PORT:8080}

# ---- Database (MySQL) ----
# Example local value: jdbc:mysql://localhost:3306/physio_clinic
# Default updated to Aiven MySQL with SSL enabled (sslMode=REQUIRED).
# You can override by setting the DB_URL environment variable.
spring.datasource.url=${DB_URL:jdbc:mysql://aivencloud.com:10134/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" auto-creates/updates tables from the entities on startup.
# Once the site is live and stable, you may switch this to "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Admin panel secret key ----
# Change this in your environment variables before going live!
admin.secret.key=${ADMIN_KEY:changeMe123}

# ---- Misc ----
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
