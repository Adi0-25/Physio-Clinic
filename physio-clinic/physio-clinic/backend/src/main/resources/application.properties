# ==========================================================
# Dr. Sanjit Kumar Physiotherapy Clinic - Application Config
# All values are read from environment variables so the SAME
# jar/image can run locally and on Render without code changes.
# See README.md for how to set these on Render.
# ==========================================================

spring.application.name=physio-clinic

# ---- Server ----
# Render provides the PORT env variable at runtime
# Bind to all interfaces so Render's port scanner can reach the service
server.address=0.0.0.0
server.port=${PORT:8080}

# ---- Database (MySQL) ----
# Example local value: jdbc:mysql://localhost:3306/physio_clinic
# Use SPRING_DATASOURCE_URL environment variable. Default points to the
# Aiven MySQL host WITHOUT embedding credentials — set credentials via
# DB_USERNAME and DB_PASSWORD (or set SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-307fc0e6-adityakr00025-efc0.h.aivencloud.com:10134/defaultdb?sslMode=REQUIRED&serverTimezone=UTC}
# Default username set to the Aiven admin user
spring.datasource.username=${DB_USERNAME:avnadmin}
# Do NOT commit real passwords. Use environment variables or a secrets manager.
spring.datasource.password=${DB_PASSWORD:YOUR_REAL_AIVEN_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# "update" auto-creates/updates tables from the entities on startup.
# Once the site is live and stable, you may switch this to "validate".
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
# Let Hibernate auto-detect the dialect to avoid deprecation warnings
# (remove or override only if you know the exact dialect needed)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Admin panel secret key ----
# Change this in your environment variables before going live!
admin.secret.key=${ADMIN_KEY:changeMe123}

# ---- Misc ----
spring.mvc.static-path-pattern=/**
spring.web.resources.static-locations=classpath:/static/
